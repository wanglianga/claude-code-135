services:
  db:
    image: postgres:15-alpine
    container_name: farmadopt-db
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farmadopt
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farmadopt"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: farmadopt-app
    environment:
      DATABASE_URL: postgres://farm:farm@db:5432/farmadopt?sslmode=disable
      JWT_SECRET: farm-adopt-dev-secret
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
